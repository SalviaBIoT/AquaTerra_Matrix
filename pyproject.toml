[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "aquaterra-matrix"
dynamic = ["version"]
description = "Software Matriz de Administración Ecológica, Agrícola y Bio-IoT del Ecosistema TerraBit"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Daniel Felipe Duque Lizarralde" }]
dependencies = ["matplotlib>=3.9,<4", "ttkbootstrap>=1.10.1,<3", "Pillow>=10.3", "pyserial>=3.5"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
aquaterra = "aquaterra.ui.app:ejecutar"

[tool.setuptools.dynamic]
version = { attr = "aquaterra.__version__" }

[tool.setuptools.packages.find]
include = ["aquaterra*"]

[tool.setuptools.package-data]
"aquaterra.ui" = ["assets/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["gui: pruebas que instancian ventanas Tk (requieren entorno gráfico)"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E741"]
